name: build-shiv

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install poetry + shiv
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'poetry>=2.0,<3.0' \
            'shiv>=1.0'

      - name: Install project deps (creates venv)
        # venv 里装好 epub_commentor 本体 + 所有 runtime deps（lockfile-pinned），
        # shiv 后面直接以这个 venv 的 python 为 source，不再需要 export/reqs.txt
        run: poetry install --no-interaction --only main

      - name: Build zipapp
        run: |
          PY="$(poetry env info -p)/bin/python"
          shiv \
            --python "$PY" \
            --python-version 313 \
            --platform manylinux2014_x86_64 \
            --console-script epub-commentor \
            --output-file epub-commentor \
            .

      - name: Smoke test (--help)
        run: |
          chmod +x ./epub-commentor
          ./epub-commentor --help

      - uses: actions/upload-artifact@v4
        with:
          name: epub-commentor-zipapp
          path: epub-commentor

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: epub-commentor