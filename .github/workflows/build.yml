name: build-shiv

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install shiv + poetry
        run: |
          python3.13 -m pip install --upgrade pip
          python3.13 -m pip install 'poetry>=2.0' 'shiv>=1.0'

      - name: Export deps as requirements.txt
        run: poetry export -f requirements.txt --without-hash -o reqs.txt

      - name: Build zipapp
        run: |
          shiv \
            --python "$(which python3.13)" \
            --python-version 313 \
            --platform manylinux2014_x86_64 \
            --console-script epub-commentor \
            --output epub-commentor \
            -r reqs.txt \
            .

      - name: Smoke test (--help)
        run: |
          chmod +x ./epub-commentor
          ./epub-commentor --help

      - uses: actions/upload-artifact@v4
        with:
          name: epub-commentor-zipapp
          path: epub-commentor

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: epub-commentor
