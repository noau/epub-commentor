[project]
name = "epub-commentor"
version = "0.1.0"
description = "Add AI-generated commentary (introductions, summaries, marginalia) to EPUB books using LLM. Fork of epub-translator."
keywords = ["epub", "llm", "commentary", "annotation", "ebook"]
authors = [
    {name = "Dexter Chen", email = "dexter@example.com"}
]
maintainers = [
    {name = "Dexter Chen", email = "dexter@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "openai>=2.14.0,<3.0.0",
    "pydantic>=2.5,<3.0",
    "rich>=13.0.0,<15.0.0",
    "rich-selector @ git+https://github.com/noau/rich-selector.git@v0.1.0",
]

[project.scripts]
epub-commentor = "epub_commentor.cli:main"

[project.urls]
Homepage = "https://github.com/noau/epub-commentor"
Repository = "https://github.com/noau/epub-commentor"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    {include = "epub_commentor" }
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.10"
pytest = "^9.0.2"
pyright = "^1.1.407"


[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
